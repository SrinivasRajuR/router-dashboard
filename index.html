<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>My Router Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {

      font-family: Arial;

      background: #111;

      color: white;

      padding: 20px;
    }

    h1 {

      margin-bottom: 20px;
    }

    .grid {

      display: grid;

      grid-template-columns:
      repeat(auto-fit, minmax(240px,1fr));

      gap: 15px;

      margin-bottom: 20px;
    }

    .card {

      background: #1e1e1e;

      padding: 20px;

      border-radius: 12px;

      box-shadow:
      0 0 10px rgba(0,0,0,0.4);
    }

    .title {

      font-size: 14px;

      color: #aaa;
    }

    .value {

      font-size: 28px;

      margin-top: 10px;

      font-weight: bold;
    }

    .online {

      color: #00ff88;
    }

    .offline {

      color: #ff4444;
    }

    .green {

      color: #00ff88;
    }

    .yellow {

      color: #ffd500;
    }

    .red {

      color: #ff4444;
    }

    table {

      width: 100%;

      border-collapse: collapse;

      margin-top: 20px;
    }

    th, td {

      border-bottom:
      1px solid #333;

      padding: 10px;

      text-align: left;
    }

    th {

      background: #222;
    }

    canvas {

      background: white;

      border-radius: 10px;

      padding: 10px;

      margin-top: 20px;
    }

    .small {

      font-size: 13px;

      color: #aaa;
    }

    #datetimeBox {

      position: fixed;

      top: 20px;

      right: 20px;

      background: #1e1e1e;

      padding: 10px 15px;

      border-radius: 10px;

      font-size: 14px;

      color: white;

      box-shadow:
      0 0 10px rgba(0,0,0,0.4);
    }

    .chartGrid {

  display: grid;

  grid-template-columns:
  repeat(auto-fit, minmax(400px,1fr));

  gap: 20px;

  margin-top: 20px;
}

.chartCard {

  background: #1e1e1e;

  padding: 15px;

  border-radius: 12px;

  box-shadow:
  0 0 10px rgba(0,0,0,0.4);
}

.chartCard h2 {

  margin-top: 0;

  margin-bottom: 15px;
}

  </style>

</head>

<body>

<h1>My Router Dashboard</h1>

<div id="datetimeBox"></div>

<div class="small" id="refreshTime">
Refreshing...
</div>

<div class="grid">

  <!-- STATUS -->

  <div class="card">

    <div class="title">
      ESP Status
    </div>

    <div
      class="value"
      id="status"
    >
      --
    </div>

  </div>

  <!-- LAST ONLINE -->

  <div
    class="card"
    id="lastOnlineCard"
    style="display:none;"
  >

    <div class="title">
      Last Online
    </div>

    <div
      class="value"
      id="lastOnline"
      style="font-size:16px;"
    >
      --
    </div>

  </div>

  <!-- TODAY UPTIME -->

  <div class="card">

    <div class="title">
      Today's Uptime
    </div>

    <div
      class="value"
      id="uptime"
    >
      --
    </div>

  </div>

  <!-- TOTAL DOWNTIME -->

  <div class="card">

    <div class="title">
      Today's Total Downtime
    </div>

    <div
      class="value"
      id="downtime"
    >
      --
    </div>

  </div>

  <!-- LIVE OUTAGE -->

  <div
    class="card"
    id="liveOutageCard"
    style="display:none;"
  >

    <div class="title">
      Live Outage
    </div>

    <div
      class="value offline"
      id="liveOutage"
      style="font-size:20px;"
    >
      --
    </div>

  </div>

  <!-- RESTARTS -->

  <div class="card">

    <div class="title">
      Today's Total Restarts
    </div>

    <div
      class="value"
      id="restarts"
    >
      --
    </div>

  </div>

  <!-- LAST BOOT -->

  <div class="card">

    <div class="title">
      Last Boot
    </div>

    <div
      class="value"
      id="lastBoot"
      style="font-size:18px;"
    >
      --
    </div>

  </div>

  <!-- HEAP -->

  <div class="card">

    <div class="title">
      Free Heap
    </div>

    <div
      class="value"
      id="heap"
    >
      --
    </div>

  </div>

</div>



<div class="chartGrid">

  <div class="chartCard">

    <h2>Last 24 Hours Uptime</h2>

    <canvas id="chart24"></canvas>

  </div>

  <div class="chartCard">

    <h2>Last 7 Days Uptime</h2>

    <canvas id="chart7"></canvas>

  </div>

</div>

<h2>Last 30 Days Uptime</h2>

<canvas id="chart30"></canvas>



<h2>Outage Logs</h2>

<table>

<thead>

<tr>

<th>Date</th>

<th>Time</th>

<th>Event</th>

<th>Downtime</th>

<th>Restarts</th>

<th>Uptime %</th>

</tr>

</thead>

<tbody id="logs">

</tbody>

</table>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwWXwrwkQWWaPDdCNrb-bEDVwOAT36veI4FkOCCoiMMbRtPfr_lusKvqGRv717qN7JqPw/exec?type=dashboard";

let chart7;

let chart30;



// ======================================
// LOAD DASHBOARD
// ======================================

async function loadDashboard() {

  try {

    const res =
      await fetch(API_URL);

    const data =
      await res.json();

    // ==================================
    // STATUS
    // ==================================

    const status =
      document.getElementById(
        "status"
      );

    const lastOnlineCard =
      document.getElementById(
        "lastOnlineCard"
      );

    const liveOutageCard =
      document.getElementById(
        "liveOutageCard"
      );

    if (data.online) {

      status.innerHTML =
        "ONLINE";

      status.className =
        "value online";

      lastOnlineCard.style.display =
        "none";

      liveOutageCard.style.display =
        "none";
    }

    else {

      status.innerHTML =
        "OFFLINE";

      status.className =
        "value offline";

      lastOnlineCard.style.display =
        "block";

      liveOutageCard.style.display =
        "block";

      document.getElementById(
        "lastOnline"
      ).innerHTML =
        data.lastOnline;

      document.getElementById(
        "liveOutage"
      ).innerHTML =
        data.liveOutage;
    }

    // ==================================
    // UPTIME
    // ==================================

    const uptimeBox =
      document.getElementById(
        "uptime"
      );

    uptimeBox.innerHTML =
      data.todayUptime + "%";

    uptimeBox.className =
      "value " + data.slaColor;

    // ==================================
    // DOWNTIME
    // ==================================

    const downBox =
      document.getElementById(
        "downtime"
      );

    downBox.innerHTML =
      data.todayDowntime;

    if (data.online) {

      downBox.className =
        "value";
    }

    else {

      downBox.className =
        "value red";
    }

    // ==================================
    // OTHER CARDS
    // ==================================

    document.getElementById(
      "restarts"
    ).innerHTML =
      data.todayRestarts;

    document.getElementById(
      "lastBoot"
    ).innerHTML =
      data.lastBoot;

    document.getElementById(
      "heap"
    ).innerHTML =
      data.heap;

    // ==================================
    // LOG TABLE
    // ==================================

    let rows = "";

    data.logs.forEach(log => {

      rows += `

      <tr>

        <td>${log.date}</td>

        <td>${log.time}</td>

        <td>${log.event}</td>

        <td>${log.downtime}</td>

        <td>${log.restarts}</td>

        <td>${log.uptime}</td>

      </tr>
      `;
    });

    document.getElementById(
      "logs"
    ).innerHTML = rows;

    // ==================================
    // CHARTS
    // ==================================

    buildCharts(data);

    // ==================================
    // REFRESH TIME
    // ==================================

    document.getElementById(
      "refreshTime"
    ).innerHTML =

      "Last Refresh: " +

      new Date()
      .toLocaleTimeString();

  }

  catch(err) {

    console.log(err);
  }
}



// ======================================
// BUILD CHARTS
// ======================================

function buildCharts(data) {

  // ====================================
  // 7 DAYS
  // ====================================

  const labels7 =
    data.last7days.map(
      x => x.date
    );

  const values7 =
    data.last7days.map(
      x => x.uptime
    );

  if (chart7)
    chart7.destroy();

  chart7 = new Chart(

    document
    .getElementById("chart7"),

    {

      type: "line",

      data: {

        labels: labels7,

        datasets: [{

          label:
          "Uptime %",

          data: values7,

          tension: 0.3
        }]
      },

      options: {

        responsive: true,

        scales: {

          y: {

            min: 0,

            max: 100
          }
        }
      }
    }
  );



  // ====================================
  // 30 DAYS
  // ====================================

  const labels30 =
    data.last30days.map(
      x => x.date
    );

  const values30 =
    data.last30days.map(
      x => x.uptime
    );

  if (chart30)
    chart30.destroy();

  chart30 = new Chart(

    document
    .getElementById("chart30"),

    {

      type: "line",

      data: {

        labels: labels30,

        datasets: [{

          label:
          "Uptime %",

          data: values30,

          tension: 0.3
        }]
      },

      options: {

        responsive: true,

        scales: {

          y: {

            min: 0,

            max: 100
          }
        }
      }
    }
  );
}



// ======================================
// CLOCK
// ======================================

function updateDateTime() {

  const now =
    new Date();

  const date =
    now.toLocaleDateString();

  const time =
    now.toLocaleTimeString();

  document.getElementById(
    "datetimeBox"
  ).innerHTML =

    date +

    "<br>" +

    time;
}



// ======================================
// START
// ======================================

loadDashboard();

updateDateTime();



// refresh dashboard every second

setInterval(
  loadDashboard,
  1000
);



// update clock every second

setInterval(
  updateDateTime,
  1000
);

</script>

</body>
</html>
