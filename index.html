<!DOCTYPE html>
<html>

<head>

  <title>
    Router Dashboard
  </title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {

      background: #111;
      color: white;
      font-family: Arial;
      margin: 0;
      padding: 20px;
    }

    h1 {

      margin-bottom: 30px;
    }

    .cards {

      display: grid;

      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));

      gap: 20px;

      margin-bottom: 40px;
    }

    .card {

      background: #1c1c1c;

      padding: 25px;

      border-radius: 20px;
    }

    .title {

      color: #aaa;

      margin-bottom: 10px;
    }

    .value {

      font-size: 32px;

      font-weight: bold;
    }

    canvas {

      background: #1c1c1c;

      padding: 20px;

      border-radius: 20px;

      margin-top: 20px;
    }

    table {

      width: 100%;

      border-collapse: collapse;

      margin-top: 30px;
    }

    th, td {

      padding: 12px;

      border-bottom: 1px solid #333;

      text-align: left;
    }

    th {

      background: #222;
    }

  </style>

</head>

<body>

  <h1>
    ESP Router Dashboard
  </h1>

  <div class="cards">

    <div class="card">

      <div class="title">
        Today's Uptime
      </div>

      <div
        class="value"
        id="uptime"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Today's Total Downtime
      </div>

      <div
        class="value"
        id="downtime"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Today's Total Restarts
      </div>

      <div
        class="value"
        id="restarts"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Last Boot
      </div>

      <div
        class="value"
        id="boot"
        style="font-size:20px"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Free Heap
      </div>

      <div
        class="value"
        id="heap"
      >
        --
      </div>

    </div>

  </div>

  <h2>
    Last 7 Days Uptime
  </h2>

  <canvas id="chart7"></canvas>

  <h2>
    Last 30 Days Uptime
  </h2>

  <canvas id="chart30"></canvas>

  <h2>
    Outage Logs
  </h2>

  <table>

    <thead>

      <tr>

        <th>Date</th>
        <th>Time</th>
        <th>Event</th>
        <th>Downtime</th>
        <th>Restarts</th>
        <th>Uptime</th>

      </tr>

    </thead>

    <tbody id="logs">

    </tbody>

  </table>

<script>

const API =
"PASTE_APPS_SCRIPT_URL_HERE?type=dashboard";

async function loadData() {

  const response =
    await fetch(API);

  const data =
    await response.json();

  document.getElementById(
    "uptime"
  ).innerText =
    data.todayUptime + "%";

  document.getElementById(
    "downtime"
  ).innerText =
    data.todayDowntime;

  document.getElementById(
    "restarts"
  ).innerText =
    data.todayRestarts;

  document.getElementById(
    "boot"
  ).innerText =
    data.lastBoot;

  document.getElementById(
    "heap"
  ).innerText =
    data.heap;

  const logs =
    document.getElementById(
      "logs"
    );

  logs.innerHTML = "";

  data.logs.forEach(log => {

    logs.innerHTML += `

      <tr>

        <td>${log.date}</td>
        <td>${log.time}</td>
        <td>${log.event}</td>
        <td>${log.downtime}</td>
        <td>${log.restarts}</td>
        <td>${log.uptime}</td>

      </tr>

    `;
  });

  createChart(
    "chart7",
    data.last7days
  );

  createChart(
    "chart30",
    data.last30days
  );
}

function createChart(id,data) {

  new Chart(
    document.getElementById(id),

    {

      type: "line",

      data: {

        labels:
          data.map(x=>x.date),

        datasets: [

          {

            label:
              "Uptime %",

            data:
              data.map(x=>x.uptime),

            tension: 0.3

          }

        ]
      }
    }
  );
}

loadData();

setInterval(
  loadData,
  30000
);

</script>

</body>
</html>
