<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ESP Router Dashboard
  </title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body {

      margin: 0;

      padding: 20px;

      background: #111;

      color: white;

      font-family: Arial;
    }

    h1 {

      text-align: center;

      margin-bottom: 20px;
    }

    .cards {

      display: grid;

      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));

      gap: 15px;

      margin-bottom: 20px;
    }

    .card {

      background: #1e1e1e;

      border-radius: 12px;

      padding: 20px;

      box-shadow:
      0 0 10px rgba(0,0,0,0.4);
    }

    .title {

      font-size: 14px;

      color: #aaa;

      margin-bottom: 10px;
    }

    .value {

      font-size: 28px;

      font-weight: bold;
    }

    .online {

      color: #00ff66;
    }

    .offline {

      color: red;
    }

    .chart-box {

      background: #1e1e1e;

      padding: 20px;

      border-radius: 12px;

      margin-bottom: 20px;
    }

    table {

      width: 100%;

      border-collapse: collapse;

      background: #1e1e1e;

      border-radius: 12px;

      overflow: hidden;
    }

    th, td {

      padding: 12px;

      border-bottom:
      1px solid #333;

      text-align: left;
    }

    th {

      background: #222;
    }

    tr:hover {

      background: #2a2a2a;
    }

  </style>

</head>

<body>

  <h1>
    ESP-01 Router Dashboard
  </h1>

  <!-- ===================== -->
  <!-- CARDS -->
  <!-- ===================== -->

  <div class="cards">

    <div class="card">

      <div class="title">
        Router Status
      </div>

      <div
        class="value"
        id="status"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Today's Uptime
      </div>

      <div
        class="value"
        id="uptime"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Today's Total Downtime
      </div>

      <div
        class="value"
        id="downtime"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Today's Total Restarts
      </div>

      <div
        class="value"
        id="restarts"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Last Boot
      </div>

      <div
        class="value"
        id="boot"
        style="font-size:18px"
      >
        --
      </div>

    </div>

    <div class="card">

      <div class="title">
        Heap Memory
      </div>

      <div
        class="value"
        id="heap"
      >
        --
      </div>

    </div>

  </div>

  <!-- ===================== -->
  <!-- LAST 7 DAYS -->
  <!-- ===================== -->

  <div class="chart-box">

    <h2>
      Last 7 Days Uptime
    </h2>

    <canvas id="chart7"></canvas>

  </div>

  <!-- ===================== -->
  <!-- LAST 30 DAYS -->
  <!-- ===================== -->

  <div class="chart-box">

    <h2>
      Last 30 Days Uptime
    </h2>

    <canvas id="chart30"></canvas>

  </div>

  <!-- ===================== -->
  <!-- LOG TABLE -->
  <!-- ===================== -->

  <div class="chart-box">

    <h2>
      Outage Logs
    </h2>

    <table>

      <thead>

        <tr>

          <th>Date</th>

          <th>Time</th>

          <th>Event</th>

          <th>Downtime</th>

          <th>Restarts</th>

          <th>Uptime</th>

        </tr>

      </thead>

      <tbody id="logs">

      </tbody>

    </table>

  </div>

  <!-- ===================== -->
  <!-- SCRIPT -->
  <!-- ===================== -->

  <script>

    // =================================
    // APPS SCRIPT API URL
    // =================================

    const API =
    "https://script.google.com/macros/s/AKfycbwWXwrwkQWWaPDdCNrb-bEDVwOAT36veI4FkOCCoiMMbRtPfr_lusKvqGRv717qN7JqPw/exec?type=dashboard";

    let chart7 = null;

    let chart30 = null;

    // =================================
    // LOAD DASHBOARD
    // =================================

    async function loadData() {

      try {

        const response =
          await fetch(API);

        const data =
          await response.json();

        // =========================
        // STATUS
        // =========================

        const status =
          document.getElementById(
            "status"
          );

        status.innerText =

          data.online
          ? "ONLINE"
          : "OFFLINE";

        status.className =

          data.online
          ? "value online"
          : "value offline";

        // =========================
        // CARDS
        // =========================

        document.getElementById(
          "uptime"
        ).innerText =
          data.todayUptime + "%";

        document.getElementById(
          "downtime"
        ).innerText =
          data.todayDowntime;

        document.getElementById(
          "restarts"
        ).innerText =
          data.todayRestarts;

        document.getElementById(
          "boot"
        ).innerText =
          data.lastBoot;

        document.getElementById(
          "heap"
        ).innerText =
          data.heap;

        // =========================
        // LOGS
        // =========================

        const logs =
          document.getElementById(
            "logs"
          );

        logs.innerHTML = "";

        data.logs.forEach(log => {

          logs.innerHTML += `

          <tr>

            <td>${log.date}</td>

            <td>${log.time}</td>

            <td>${log.event}</td>

            <td>${log.downtime}</td>

            <td>${log.restarts}</td>

            <td>${log.uptime}%</td>

          </tr>
          `;
        });

        // =========================
        // CHARTS
        // =========================

        updateChart(

          "chart7",

          data.last7days,

          chart7,

          function(c) {

            chart7 = c;
          }
        );

        updateChart(

          "chart30",

          data.last30days,

          chart30,

          function(c) {

            chart30 = c;
          }
        );
      }

      catch(err) {

        console.log(err);
      }
    }

    // =================================
    // UPDATE CHART
    // =================================

    function updateChart(

      id,

      data,

      chartRef,

      setChart
    ) {

      if (chartRef) {

        chartRef.destroy();
      }

      const newChart =

        new Chart(

          document.getElementById(id),

          {

            type: "line",

            data: {

              labels:

                data.map(
                  x => x.date
                ),

              datasets: [

                {

                  label:
                    "Uptime %",

                  data:

                    data.map(
                      x => x.uptime
                    ),

                  tension: 0.3
                }
              ]
            },

            options: {

              responsive: true,

              scales: {

                y: {

                  min: 0,

                  max: 100
                }
              }
            }
          }
        );

      setChart(newChart);
    }

    // =================================
    // INITIAL LOAD
    // =================================

    loadData();

    // =================================
    // AUTO REFRESH EVERY SECOND
    // =================================

    setInterval(

      loadData,

      1000
    );

  </script>

</body>

</html>
